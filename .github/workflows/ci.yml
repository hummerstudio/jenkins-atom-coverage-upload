name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  atom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: atom

      # The SDK and the build parent are ours and not published to Maven Central, so CI puts them where the atom's
      # <relativePath> expects them: ../jenkins-atom-sdk/atoms-parent/pom.xml.
      - uses: actions/checkout@v4
        with:
          repository: hummerstudio/jenkins-atom-sdk
          path: jenkins-atom-sdk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the SDK and the build parent
        run: mvn -B -ntp -q -f jenkins-atom-sdk/pom.xml install -DskipTests && mvn -B -ntp -q -f jenkins-atom-sdk/atoms-parent/pom.xml install -N

      # package, then the atom's own smoke script as an integration test
      - name: Build, package and smoke test
        run: mvn -B -ntp -f atom/pom.xml verify

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-atom
          path: atom/dist/coverage/
